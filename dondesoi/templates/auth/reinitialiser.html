{% extends "base.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<h1>Choisir un nouveau mot de passe</h1>
<form class="stack" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div><label for="password">Nouveau mot de passe <span class="hint">(8 caractères minimum)</span></label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"></div>
  <div><label for="password2">Confirmez-le</label>
    <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password"></div>
  <div><button class="btn">Enregistrer</button></div>
</form>
{% endblock %}
