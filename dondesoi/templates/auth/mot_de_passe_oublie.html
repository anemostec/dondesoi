{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<h1>Mot de passe oublié</h1>
<p class="muted">Indiquez l'adresse e-mail de votre compte : nous vous enverrons un lien pour
  choisir un nouveau mot de passe.</p>
<form class="stack" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div><label for="email">E-mail</label><input type="email" id="email" name="email" required></div>
  <div><button class="btn">Recevoir le lien</button></div>
</form>
<p class="muted"><a href="{{ url_for('auth.connexion') }}">Revenir à la connexion</a></p>
{% endblock %}
